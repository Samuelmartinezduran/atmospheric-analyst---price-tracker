# Tres servicios, una imagen (ver docs/DECISIONES.md, D4).
# Toda la configuración sale de .env (copia .env.example). Aquí no se repiten valores por defecto.
name: atmospheric-analyst

x-app: &app
  image: atmospheric-analyst:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-tracker}
  depends_on:
    db:
      condition: service_healthy
  # Chromium necesita algo más de memoria compartida que los 64 MB por defecto.
  shm_size: 512mb

services:
  db:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Solo accesible desde este PC (antes se publicaba en toda la red local).
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *app
    build:
      context: .
      target: runtime
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_HOST_PORT:-8001}:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  db_data:
